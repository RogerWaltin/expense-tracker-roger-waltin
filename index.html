<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Expense Tracker</h1>
    </header>

    <section class="balance-section">
      <h2>Your Balance</h2>
      <div id="balance" class="balance">$0.00</div>
      <div class="income-expense">
        <div class="income-box">
          <h3>Income</h3>
          <p id="total-income" class="money income">+$0.00</p>
        </div>
        <div class="expense-box">
          <h3>Expenses</h3>
          <p id="total-expense" class="money expense">-$0.00</p>
        </div>
      </div>
    </section>

    <section class="form-section">
      <h2>Add Transaction</h2>
      <form id="transaction-form">
        <div class="form-group">
          <label for="type">Type</label>
          <select id="type" required>
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <input type="text" id="description" placeholder="e.g. Groceries" required maxlength="100" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" required></select>
        </div>
        <div class="form-group">
          <label for="amount">Amount ($)</label>
          <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>
        <div id="form-error" class="error-message" role="alert" aria-live="polite"></div>
        <button type="submit" id="submit-btn">Add Transaction</button>
      </form>
    </section>

    <section class="history-section">
      <div class="history-header">
        <h2>Transaction History</h2>
        <div class="filters">
          <select id="filter-type">
            <option value="all">All Types</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <select id="filter-category">
            <option value="all">All Categories</option>
          </select>
        </div>
      </div>
      <div id="transactions-list" class="transactions-list">
        <p id="empty-message" class="empty-message">No transactions yet. Add one above!</p>
      </div>
    </section>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
